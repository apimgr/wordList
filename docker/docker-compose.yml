name: wordList

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  wordList:
    image: ghcr.io/apimgr/wordlist:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      MODE: production
      TZ: UTC
      PORT: "80"
      CONFIG_DIR: /config/wordList
      DATA_DIR: /data/wordList
    ports:
      - "172.17.0.1:64580:80"
    volumes:
      - ./volumes/config:/config
      - ./volumes/data:/data
    networks:
      - wordList
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:80/api/v1/server/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  wordList:
    name: wordList
